services:
  postgres:
    restart: unless-stopped
  api:
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      CORS_ALLOWED_ORIGINS: https://${HEMOVIA_PUBLIC_IP:?Defina HEMOVIA_PUBLIC_IP}
      HEMOVIA_API_DOCS_ENABLED: "false"
      REGISTRATION_FRONTEND_URL: https://${HEMOVIA_PUBLIC_IP:?Defina HEMOVIA_PUBLIC_IP}/
      REGISTRATION_EMAIL_FROM: no-reply@hemovia.test
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      DONATION_CHAT_ENABLED: &chat_enabled ${DONATION_CHAT_ENABLED:-false}
      DONATION_CHAT_OLLAMA_URL: http://ollama:11434
      DONATION_CHAT_OLLAMA_MODEL: &chat_model qwen3:4b-instruct-2507-q4_K_M
  ollama:
    image: ollama/ollama@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 4g
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "-1"
      DONATION_CHAT_ENABLED: *chat_enabled
      OLLAMA_WARMUP_MODEL: *chat_model
    volumes:
      - ollama_modelos:/root/.ollama
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ollama list >/dev/null && {
            [ "$$DONATION_CHAT_ENABLED" != "true" ] ||
            ollama ps | grep -Fq -- "$$OLLAMA_WARMUP_MODEL" ||
            { ollama show "$$OLLAMA_WARMUP_MODEL" >/dev/null &&
              ollama run "$$OLLAMA_WARMUP_MODEL" "" >/dev/null &&
              ollama ps | grep -Fq -- "$$OLLAMA_WARMUP_MODEL"; };
          }
      interval: 10s
      timeout: 60s
      start_period: 60s
      retries: 3
  prometheus:
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
  grafana:
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${HEMOVIA_PUBLIC_IP:?Defina HEMOVIA_PUBLIC_IP}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
  loki:
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -compactor.working-directory=/tmp/loki/compactor
      - -compactor.retention-enabled=true
      - -compactor.delete-request-store=filesystem
      - -store.retention=72h
  tempo:
    restart: unless-stopped
  alloy:
    restart: unless-stopped
  node-exporter:
    restart: unless-stopped
  cadvisor:
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports: ["127.0.0.1:18025:8025"]
  caddy:
    image: caddy:2.11.1-alpine
    restart: unless-stopped
    environment:
      HEMOVIA_PUBLIC_IP: ${HEMOVIA_PUBLIC_IP:?Defina HEMOVIA_PUBLIC_IP}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - demo_caddy_data:/data
      - demo_caddy_config:/config

volumes:
  ollama_modelos:
    name: hemovia-ollama-modelos
    external: true
  demo_caddy_data:
  demo_caddy_config:
