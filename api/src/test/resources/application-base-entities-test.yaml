# Usado apenas pelo perfil Maven explícito de aceite. Não importa .env.
spring:
  datasource:
    url: ${HEMOVIA_TEST_JDBC_URL}
    username: ${HEMOVIA_TEST_DB_USER}
    password: ${HEMOVIA_TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
springdoc:
  api-docs:
    enabled: ${HEMOVIA_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${HEMOVIA_API_DOCS_ENABLED:true}
    url: /v3/api-docs
    disable-swagger-default-url: true
    persist-authorization: false
logging:
  level:
    root: WARN
