server:
  # O Render informa a porta pela variável PORT; localmente usa 8080
  port: ${PORT:8080}

spring:
  application:
    name: api
  config:
    import: "optional:file:.env[.properties],optional:file:api/.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Expiração do token legado; some na Seção 3, quando o JWT em header der lugar aos cookies
  expiration: ${JWT_EXPIRATION:86400000}

hemovia:
  security:
    # Obrigatório e sem valor padrão: a aplicação não sobe sem JWT_SECRET de pelo menos 32 caracteres
    jwt-secret: ${JWT_SECRET}
    # Duração do access token em minutos
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    # Duração do refresh token em dias
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
    # Cookies só trafegam por HTTPS; desligue apenas no desenvolvimento local sem HTTPS
    cookie-secure: ${COOKIE_SECURE:true}
    # Política SameSite dos cookies de sessão
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    # Origens do front-end liberadas no CORS, separadas por vírgula
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin-bootstrap:
    # Dados do primeiro ADMIN; ficam vazios por padrão e só valem na primeira subida
    name: ${ADMIN_NAME:}
    email: ${ADMIN_EMAIL:}
    cpf: ${ADMIN_CPF:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
