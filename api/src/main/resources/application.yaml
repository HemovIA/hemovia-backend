spring:
  application:
    name: api
  config:
    import: "optional:file:.env[.properties],optional:file:api/.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: ${HEMOVIA_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${HEMOVIA_API_DOCS_ENABLED:true}
    url: /v3/api-docs
    disable-swagger-default-url: true
    persist-authorization: false
