server:
  # O Render informa a porta pela variável PORT; localmente usa 8080
  port: ${PORT:8080}

spring:
  application:
    name: ${APP_NAME:hemovia-api}
  config:
    import: "optional:file:.env[.properties],optional:file:api/.env[.properties]"
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  packages-to-scan: com.hemovia.api.controller
  api-docs:
    enabled: ${HEMOVIA_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${HEMOVIA_API_DOCS_ENABLED:true}
    url: /v3/api-docs
    disable-swagger-default-url: true
    persist-authorization: false
hemovia:
  registration:
    sender: ${REGISTRATION_EMAIL_FROM:}
    frontend-url: ${REGISTRATION_FRONTEND_URL:http://localhost:5173/}
  donation-chat:
    enabled: ${DONATION_CHAT_ENABLED:false}
    base-url: ${DONATION_CHAT_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${DONATION_CHAT_OLLAMA_MODEL:qwen2.5:7b}
    connect-timeout: ${DONATION_CHAT_CONNECT_TIMEOUT:3s}
    request-timeout: ${DONATION_CHAT_REQUEST_TIMEOUT:30s}
  # OSRM: valores finitos e limite compatível com o servidor público
  routing:
    base-url: ${ROUTING_BASE_URL:https://router.project-osrm.org}
    connect-timeout: ${ROUTING_CONNECT_TIMEOUT:5s}
    request-timeout: ${ROUTING_REQUEST_TIMEOUT:15s}
    minimum-interval: ${ROUTING_MINIMUM_INTERVAL:1s}
    platelets-max-seconds: ${ROUTING_PLATELETS_MAX_SECONDS:3600}
  security:
    # Obrigatório e sem valor padrão: a aplicação não sobe sem JWT_SECRET de pelo menos 32 caracteres
    jwt-secret: ${JWT_SECRET}
    # Duração do access token em minutos
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    # Duração do refresh token em dias
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
    # Cookies só trafegam por HTTPS; desligue apenas no desenvolvimento local sem HTTPS
    cookie-secure: ${COOKIE_SECURE:true}
    # Política SameSite dos cookies de sessão
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    # Origens do front-end liberadas no CORS, separadas por vírgula
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin-bootstrap:
    # Dados do primeiro ADMIN; ficam vazios por padrão e só valem na primeira subida
    name: ${ADMIN_NAME:}
    email: ${ADMIN_EMAIL:}
    cpf: ${ADMIN_CPF:}
    password: ${ADMIN_PASSWORD:}

management:
  health:
    mail:
      enabled: false
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
