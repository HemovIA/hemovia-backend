server:
  # O Render informa a porta pela variável PORT; localmente usa 8080
  port: ${PORT:8080}

spring:
  application:
    name: api
  config:
    import: "optional:file:.env[.properties],optional:file:api/.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Sem valor padrão: se JWT_SECRET não for informado, a aplicação não sobe
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
