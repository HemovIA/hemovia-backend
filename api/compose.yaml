services:
  postgres:
    image: postgres:16-alpine
    container_name: hemovia_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hemovia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: hemovia-api:local
    container_name: hemovia_api
    env_file: .env
    environment:
      # Dentro da rede do Compose a API encontra o banco pelo nome do serviço
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - hemovia_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  # Ferramenta opcional: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4
    container_name: hemovia_pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - hemovia_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  hemovia_network:
    driver: bridge
