name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) BUILD + TESTES — roda em todo push e pull request. Vermelho aqui barra o merge (main protegida).
  test:
    name: Build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hemovia_test
          POSTGRES_USER: hemovia
          POSTGRES_PASSWORD: hemovia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hemovia -d hemovia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hemovia_test
      POSTGRES_USER: hemovia
      POSTGRES_PASSWORD: hemovia
      JWT_SECRET: ci-only-secret-key-for-tests-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e rodar testes (unitários, integração e aceitação)
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: api/target/surefire-reports/

  # 2) IMAGEM — só depois dos testes verdes e só na main
  image:
    name: Imagem Docker (GHCR)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem (minúsculo, exigência do GHCR)
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest

  # 3) DEPLOY — publica a imagem da versão exata (tag = SHA do commit) no Render
  deploy:
    name: Deploy no Render
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Disparar deploy da imagem ${{ github.sha }}
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
        run: |
          ENCODED=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"

      - name: Smoke test — /actuator/health deve responder UP
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "$APP_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "Aplicação no ar: $APP_URL"; exit 0
            fi
            echo "Aguardando deploy... ($i/40)"; sleep 15
          done
          echo "Health check falhou após o deploy"; exit 1
