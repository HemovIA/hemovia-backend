name: Deploy AWS Demo

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true

permissions: {}

concurrency:
  group: hemovia-aws-demo
  cancel-in-progress: false

jobs:
  package:
    name: Preparar versao validada
    if: github.ref == 'refs/heads/main' && inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: HemovIA/hemovia-frontend
          ref: main
          path: frontend
          persist-credentials: false
      - name: Identificar os commits validados
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          frontend_sha=$(git -C frontend rev-parse HEAD)
          successful_run() {
            gh api --method GET "repos/$1/actions/workflows/$2/runs" \
              -f "head_sha=$3" -f status=success -f branch=main \
              --jq 'any(.workflow_runs[]; .event == "push" and .conclusion == "success")'
          }
          test "$(successful_run HemovIA/hemovia-backend ci-cd.yml "$GITHUB_SHA")" = true
          test "$(successful_run HemovIA/hemovia-frontend ci.yml "$frontend_sha")" = true
          echo "release=$GITHUB_SHA-$frontend_sha" >> "$GITHUB_OUTPUT"
          printf 'Backend %s\nFrontend %s\n' "$GITHUB_SHA" "$frontend_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compilar frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm run build
      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Empacotar imagem e frontend
        env:
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"' EXIT
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker pull --platform linux/amd64 "$image"
          docker tag "$image" "hemovia-api:$GITHUB_SHA"
          docker save "hemovia-api:$GITHUB_SHA" -o "$stage/image.tar"
          cp -a docker-compose.yml prometheus grafana loki tempo "$stage/"
          mkdir -p "$stage/deploy/lightsail"
          cp deploy/lightsail/Caddyfile deploy/lightsail/compose.yaml "$stage/deploy/lightsail/"
          cp -a frontend/dist "$stage/frontend"
          tar -czf "$RUNNER_TEMP/$RELEASE.tar.gz" -C "$stage" .
      - uses: actions/upload-artifact@v4
        with:
          name: hemovia-demo-release
          path: ${{ runner.temp }}/${{ steps.version.outputs.release }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  apply:
    name: Aplicar na demo AWS
    needs: package
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.package.result == 'success' || inputs.operation == 'rollback') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      OPERATION: ${{ inputs.operation || 'deploy' }}
      RELEASE: ${{ needs.package.outputs.release }}
      RELEASE_BUCKET: ${{ vars.HEMOVIA_RELEASE_BUCKET }}
      SSM_DOCUMENT: ${{ vars.HEMOVIA_SSM_DOCUMENT }}
      SSM_NODE: ${{ vars.HEMOVIA_SSM_NODE }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.OPERATION == 'deploy'
        with:
          name: hemovia-demo-release
          path: ${{ runner.temp }}
      - name: Obter credenciais temporarias da AWS
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.HEMOVIA_AWS_ROLE_ARN }}
          role-session-name: hemovia-demo-${{ github.run_id }}
      - name: Guardar o pacote validado
        if: env.OPERATION == 'deploy'
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/$RELEASE.tar.gz"
          key="releases/$RELEASE.tar.gz"
          aws s3api put-object --bucket "$RELEASE_BUCKET" --key "$key" --body "$file" \
            --checksum-algorithm SHA256 --if-none-match '*' ||
            aws s3api head-object --bucket "$RELEASE_BUCKET" --key "$key" > /dev/null
      - name: Executar e verificar na VM
        run: |
          set -euo pipefail
          test "$OPERATION" = deploy || test "$OPERATION" = rollback
          parameters=$(jq -cn --arg operation "$OPERATION" --arg release "$RELEASE" \
            '{Operation: [$operation], Release: [$release]}')
          command_id=$(aws ssm send-command --document-name "$SSM_DOCUMENT" \
            --instance-ids "$SSM_NODE" --parameters "$parameters" --query Command.CommandId --output text)
          printf 'Operação %s, comando SSM %s\n' "$OPERATION" "$command_id" >> "$GITHUB_STEP_SUMMARY"

          status=Pending
          for ((remaining=95; remaining>0; remaining--)); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$SSM_NODE" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success|Cancelled|Failed|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$SSM_NODE" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          test "$status" = Success
